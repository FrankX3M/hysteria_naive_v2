# /etc/fail2ban/filter.d/hysteria2.conf — генерируется hysteria_naive
# Формат строки задаёт tools/proxy_authd.py:
#   auth failed ip=203.0.113.5 port=51234 user=alice reason=bad-password
# Проверка: fail2ban-regex systemd-journal /etc/fail2ban/filter.d/hysteria2.conf
[Definition]
failregex = ^.*auth failed ip=<HOST> .*$
ignoreregex =
